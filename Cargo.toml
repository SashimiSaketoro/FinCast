[package]
name = "stg-mamba"
version = "0.1.0"
edition = "2021"
authors = ["FinCast Contributors"]
description = "STG-Mamba implementation in Rust using Burn for financial time-series prediction"
license = "MIT"
repository = "https://github.com/SashimiSaketoro/FinCast"

[dependencies]
# Burn deep learning framework
burn = { version = "0.16", features = ["train", "std", "ndarray"] }
burn-ndarray = { version = "0.16" }
burn-autodiff = { version = "0.16" }

# Numerical computing
ndarray = "0.16"
ndarray-csv = "0.5"
ndarray-npy = "0.9"
num-traits = "0.2"

# Data processing
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
log = "0.4"
env_logger = "0.11"

# Async runtime and WebSockets
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client for APIs
reqwest = { version = "0.12", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Circular buffer for sequence management
ringbuffer = "0.15"

# URL parsing
url = "2.5"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "stg-mamba"
path = "src/main.rs"

[lib]
name = "stg_mamba"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
